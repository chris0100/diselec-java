<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="plantilla/template :: common-header"/>

<body>

<!-- barra de navegacion-->
<div th:replace="plantilla/template :: navbar"/>

<section class="header-nuevo--producto" style="padding-top: 120px;">
    <div class="container">

        <div class="row" style="min-height: 110px;">

        </div>


        <div class="wrap-contact100 mx-auto">

            <form th:action="@{/nuevoProducto}" method="post" enctype="multipart/form-data">


                <span class="contact100-form-title">Nuevo producto</span>

                <input type="hidden" name="id" th:value="${producto.id}">


                <div class="form-group wrap-input100">
                    <span class="label-input100">Nombre</span>
                    <input class="input100" type="text" name="nombre" placeholder="Ingresa el nombre del producto"
                           th:value="${producto.nombre}">
                    <span class="focus-input100"></span>
                </div>


                <div class="form-group wrap-input100">
                    <span class="label-input100">Descripcion</span>
                    <input class="input100" type="text" name="descripcion"
                           placeholder="Ingresa la descripcion del producto" th:value="${producto.descripcion}">
                    <span class="focus-input100"></span>
                </div>


                <div class="form-group wrap-input100">
                    <span class="label-input100">Precio</span>
                    <input class="input100" type="number" name="precio" placeholder="Ingresa el precio del producto"
                           th:value="${producto.precio}">
                    <span class="focus-input100"></span>
                </div>


                <div class="form-group">
                    <span class="label-input100">Estatus</span>
                    <select th:name="estatus" class="form-control" th:value="${producto.estatus}"
                            required="required">
                        <option th:value="Activo">Activo</option>
                        <option th:value="Inactivo">Inactivo</option>
                    </select>
                </div>


                <div class="form-group wrap-input100">
                    <span class="label-input100">Cantidad</span>
                    <input class="input100" type="number" name="cantidad" placeholder="Ingresa la cantidad del producto"
                           th:value="${producto.cantidad}">
                    <span class="focus-input100"></span>
                </div>


                <div class="form-group">
                    <span class="label-input100">Categoria</span>
                    <select th:name="categoria" class="form-control" th:value="${producto.categoria}"
                            required="required">
                        <option value="" disabled="disabled" selected>Seleccionar una opcion</option>
                        <option th:each="categoria : ${listaCategorias}" th:text="${categoria}"
                                th:selected="(${producto.categoria}==${categoria})"></option>
                    </select>
                </div>


                <div class="form-group">
                    <span class="label-input100">Cargar imagen</span>
                    <input type="hidden" name="imagen" th:value="${producto.imagen}">
                    <input type="file" name="imagenProducto">
                </div>


                <div class="container-contact100-form-btn">
                    <div class="wrap-contact100-form-btn">
                        <div class="contact100-form-bgbtn"></div>
                        <button class="contact100-form-btn" type="submit">
							<span>
								Enviar
								<i class="fa fa-long-arrow-right m-l-7" aria-hidden="true"></i>
							</span>
                        </button>
                    </div>
                </div>

                <div class="container-contact100-form-btn">
                    <div class="wrap-contact100-form-btn">
                        <div class="contact100-form-bgbtn"></div>
                        <a class="contact100-form-btn" th:href="@{/listaProductos}">
							<span>
                                <i class="fa fa-long-arrow-left m-l-7" aria-hidden="true"></i>
								Cancelar
							</span>
                        </a>
                    </div>
                </div>


            </form>

        </div>
    </div>

</section>


<footer th:replace="plantilla/template :: footer"/>
<div th:replace="plantilla/template :: body-bottom-scripts"/>

</body>
</html>
