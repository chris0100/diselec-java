<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="plantilla/template :: common-header"/>

<body>

<!-- barra de navegacion-->
<div th:replace="plantilla/template :: navbar"/>

<section class="header-login" style="padding-top: 215px;">
    <div class="container">


        <div class="scrolli">


            <div class="wrap-contact100 mx-auto">
                <form th:action="@{/recuperarContraseña}" method="post">


                    <span class="contact100-form-title">Recuperar contraseña</span>

                    <input type="hidden" name="id" th:value="${usuario.id}">


                    <div class="form-group wrap-input100">
                        <span class="label-input100">Contraseña</span>
                        <input class="input100" type="password" name="password" placeholder="Ingresa tu contraseña">
                        <span class="focus-input100"></span>
                    </div>


                    <div class="form-group wrap-input100">
                        <span class="label-input100">Repetir Contraseña</span>
                        <input class="input100" type="password" name="confirmarPassword" placeholder="Ingresa nuevamente tu contraseña">
                        <span class="focus-input100"></span>
                    </div>

                    <div class="container-contact100-form-btn">
                        <div class="wrap-contact100-form-btn">
                            <div class="contact100-form-bgbtn"></div>
                            <button class="contact100-form-btn" type="submit">
							<span>
								Enviar
								<i class="fa fa-long-arrow-right m-l-7" aria-hidden="true"></i>
							</span>
                            </button>
                        </div>
                    </div>


                </form>
            </div>


        </div>
    </div>
</section>


<footer th:replace="plantilla/template :: footer"/>
<div th:replace="plantilla/template :: body-bottom-scripts"/>

</body>
</html>
