<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="plantilla/template :: common-header"/>

<body>

<!-- barra de navegacion-->
<div th:replace="plantilla/template :: navbar"/>

<div class="container">

    <div class="row" style="min-height: 110px;">

    </div>

    <div class="row">

        <!--categorias de productos-->
        <div class="col-md-3" style="min-height: 800px;margin-top: 115px;">

            <h5 class="mb-2">Categorías</h5>
            <hr/>

            <ul class="list-group" id="categoria">
                <a th:href="@{/catalogoProductos}" th:classappend="${activeAll}? 'active'"
                   class="list-group-item list-group-item-action ">Todos</a>

                <a th:href="@{/buscarCategoria(categoria='Displays')}" class="list-group-item list-group-item-action" th:classappend="${activeDisplays}? 'active'">Displays</a>

                <a th:href="@{/buscarCategoria(categoria='Conectores')}" class="list-group-item list-group-item-action" th:classappend="${activeConectores}? 'active'">Conectores</a>

                <a th:href="@{/buscarCategoria(categoria='Instrumentos')}" class="list-group-item list-group-item-action" th:classappend="${activeInstrumentos}? 'active'">Instrumentos</a>

                <a th:href="@{/buscarCategoria(categoria='Arduino')}" class="list-group-item list-group-item-action" th:classappend="${activeArduino}? 'active'">Arduino</a>

                <a th:href="@{/buscarCategoria(categoria='Microcontroladores')}" class="list-group-item list-group-item-action" th:classappend="${activeMicrocontroladores}? 'active'">Microcontroladores</a>

                <a th:href="@{/buscarCategoria(categoria='Programadores')}" class="list-group-item list-group-item-action" th:classappend="${activeProgramadores}? 'active'">Programadores</a>

                <a th:href="@{/buscarCategoria(categoria='Motores')}" class="list-group-item list-group-item-action" th:classappend="${activeMotores}? 'active'">Motores</a>

                <a th:href="@{/buscarCategoria(categoria='Sensores')}" class="list-group-item list-group-item-action" th:classappend="${activeSensores}? 'active'">Sensores</a>

                <a th:href="@{/buscarCategoria(categoria='Sistemas OIT')}" class="list-group-item list-group-item-action" th:classappend="${activeSistemasOIT}? 'active'">Sistemas OIT</a>

                <a th:href="@{/buscarCategoria(categoria='Pololu')}" class="list-group-item list-group-item-action" th:classappend="${activePololu}? 'active'">Pololu</a>

                <a th:href="@{/buscarCategoria(categoria='Montaje superficial')}" class="list-group-item list-group-item-action" th:classappend="${activeMontajesuperficial}? 'active'">Montaje superficial</a>

                <a th:href="@{/buscarCategoria(categoria='Intel')}"  class="list-group-item list-group-item-action" th:classappend="${activeIntel}? 'active'">Intel</a>

                <a th:href="@{/buscarCategoria(categoria='Impresoras termicas')}" class="list-group-item list-group-item-action" th:classappend="${activeImpresorastermicas}? 'active'">Impresoras termicas</a>
            </ul>

            <div class="text-center">
                <img th:src="@{/img/envio_gratis.png}" class="img-fluid my-2">
            </div>

            <hr/>

            <div class="text-center">
                <img th:src="@{/img/iva_promocion.png}" class="img-fluid my-2">
            </div>

        </div>


        <!--catalogo-->
        <div class="col-md-9 mt-5" style="min-height: 800px;">
            <div class="row">
                <span class="contact100-form-title ml-3" style="color: #0d16ac">Detalle Producto</span>
            </div>

            <hr/>

            <div class="row">

                <div class="col-md-4  d-flex align-items-center justify-content-center">
                    <img th:src="@{/img/productos/}+${producto.imagen}" class="img-fluid">
                </div>

                <div class="col-md-8">

                        <h1 th:text="${#strings.toUpperCase(producto.nombre)}">Nombre del producto</h1>

                        <p style="font-size: 3rem !important;"><strong>$</strong> <strong th:text="${producto.precio}"></strong></p>

                        <p th:text="${producto.descripcion}">Descripcion producto</p>

                        <div class="mt-3 mb-3">
                            <span class="text-success font-weight-bold font-italic "><strong th:text="${producto.cantidad}"></strong> disponibles</span>
                        </div>


                    <div class="row ml-1">
                        <input type="number" name="cantidad" class="form-control w-25">
                        <button class="btn btn-primary ml-3">Añadir al carrito</button>
                    </div>

                </div>

            </div>





        </div>


    </div>
</div>


<footer th:replace="plantilla/template :: footer"/>
<div th:replace="plantilla/template :: body-bottom-scripts"/>

</body>
</html>
